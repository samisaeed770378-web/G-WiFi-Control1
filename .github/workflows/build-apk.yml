name: G-WiFi-Control1 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3"
          pip install buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Find APK
        run: |
          mkdir -p bin
          find . -type f -name "*.apk" -print
          APK=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi
          cp "$APK" bin/G-WiFi-Control1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G-WiFi-Control1-APK
          path: bin/G-WiFi-Control1.apk
          if-no-files-found: error
